name: Publish to npm

# The package follows the releases, like the documentation site: publishing a
# GitHub release (which `npm run release` does) publishes that tag to npm. There
# is no token to rotate — npm trusts this workflow directly (trusted publishing,
# configured once on npmjs.com; see CONTRIBUTING.md).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

# Never two publishes at once, and never cancel one halfway.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with 10.
      - run: npm install -g npm@latest

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong number,
      # and a version on npm can never be reused.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release $TAG does not match package.json ($version)."
            exit 1
          fi

      # Prereleases (1.1.0-beta.1) go out under `next`, so `npm install` keeps
      # resolving to the latest stable version.
      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
